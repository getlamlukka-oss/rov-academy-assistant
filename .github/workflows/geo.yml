name: GEO Optimizer Audit

'on':
  workflow_dispatch:
    inputs:
      url:
        description: Public website URL to audit
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/geo.yml

jobs:
  geo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run GEO Optimizer Audit
        uses: Auriti-Labs/geo-optimizer-skill@v4.18.3
        with:
          url: ${{ inputs.url || 'https://academy.rov.in.th' }}
          min-score: 70
          format: sarif
