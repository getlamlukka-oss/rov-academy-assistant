name: GEO Optimizer Audit

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/geo.yml

jobs:
  geo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Run GEO Optimizer Audit
        uses: Auriti-Labs/geo-optimizer-skill@v4.18.3
        with:
          url: https://rov-pocket-club-f27a.getlamlukka.chatgpt.site/
          min-score: 0
          format: json
